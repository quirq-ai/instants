<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">XO Builders onboarding design</title><desc id="desc">A warm, spacious desktop welcome screen showing three guided setup steps with an invite-your-team action.</desc><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#232735" flood-opacity=".10"/></filter><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDC3FA"/><stop offset="1" stop-color="#EFEBFD"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2E8D3"/><stop offset="1" stop-color="#F4F3ED"/></linearGradient></defs><rect width="1080" height="1080" fill="#EFEFE7"/><g font-family="Inter, Arial, Helvetica, sans-serif"><rect x="56" y="49" width="43" height="43" rx="13" fill="#333F2B" /><text x="77.5" y="77" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">XO</text><text x="112" y="77" font-size="17" fill="#3C4434" font-weight="700" letter-spacing="2">XO BUILDERS</text><text x="1024" y="77" font-size="14" fill="#74796D" font-weight="500" text-anchor="end" letter-spacing="1.3">DESIGN REVIEW / 01</text><text x="56" y="168" font-size="66" fill="#303A29" font-weight="600" letter-spacing="-3">A better first hello.</text><text x="60" y="215" font-size="23" fill="#7B8073" font-weight="400" >A little guidance. A workspace that already feels like yours.</text><rect x="56" y="274" width="968" height="692" rx="22" fill="#FFF" filter="url(#shadow)"/><rect x="56" y="274" width="968" height="48" rx="20" fill="#FAFBF8" /><rect x="56" y="298" width="968" height="24" rx="0" fill="#FAFBF8" /><circle cx="80" cy="298" r="5" fill="#D9DED3"/><circle cx="98" cy="298" r="5" fill="#D9DED3"/><circle cx="116" cy="298" r="5" fill="#D9DED3"/><text x="540" y="303" font-size="12" fill="#999E93" font-weight="400" text-anchor="middle">workspace / xo_builders</text><path d="M56 322h968" stroke="#E9ECE4"/><rect x="56" y="322" width="185" height="620" rx="0" fill="#F8F9F5" /><text x="83" y="368" font-size="20" fill="#33432E" font-weight="700" >XO workspace</text><text x="83" y="407" font-size="10" fill="#9BA18F" font-weight="600" letter-spacing="2">TEAM SPACE</text><rect x="70" y="426" width="155" height="39" rx="8" fill="#EAF0DF" /><text x="91" y="451" font-size="13" fill="#566B3C" font-weight="600" >⌂  Overview</text><text x="91" y="494" font-size="13" fill="#888F7B" font-weight="400" >Projects</text><text x="91" y="537" font-size="13" fill="#888F7B" font-weight="400" >Your team</text><text x="91" y="580" font-size="13" fill="#888F7B" font-weight="400" >Settings</text><circle cx="99" cy="910" r="17" fill="#E0E8D1"/><text x="99" y="915" font-size="10" fill="#566B3C" font-weight="600" text-anchor="middle">AM</text><text x="124" y="907" font-size="11" fill="#3D4733" font-weight="600" >Alex Morgan</text><text x="124" y="924" font-size="9" fill="#959C89" font-weight="400" >Product lead</text><rect x="283" y="360" width="147" height="32" rx="16" fill="#EFF3E7" /><text x="356.5" y="381" font-size="13" fill="#687C48" font-weight="600" text-anchor="middle">GETTING STARTED</text><text x="283" y="429" font-size="37" fill="#2E3827" font-weight="600" letter-spacing="-1.2">Welcome to your next</text><text x="283" y="474" font-size="37" fill="#2E3827" font-weight="600" letter-spacing="-1.2">great thing, Alex.</text><text x="284" y="510" font-size="15" fill="#929984" font-weight="400" >A clear space for your team to make things happen.</text><rect x="283" y="550" width="692" height="77" rx="12" fill="#F4F7EF" /><circle cx="318" cy="588" r="17" fill="#DFE9CF"/><path d="m310 588 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="581" font-size="17" fill="#435632" font-weight="600" >Make it yours</text><text x="350" y="605" font-size="12" fill="#8C987B" font-weight="400" >Workspace created. Looking good.</text><rect x="861" y="573" width="82" height="32" rx="16" fill="#E6EEDB" /><text x="902" y="594" font-size="13" fill="#647847" font-weight="600" text-anchor="middle">Done</text><rect x="283" y="643" width="692" height="111" rx="12" fill="#FFF" stroke="#D6E2C7" stroke-width="2"/><circle cx="318" cy="680" r="17" fill="#F1F5E9"/><text x="318" y="686" font-size="15" fill="#617A43" font-weight="600" text-anchor="middle">2</text><text x="350" y="677" font-size="17" fill="#435632" font-weight="600" >Better with your team</text><text x="350" y="703" font-size="12" fill="#8C987B" font-weight="400" >Invite a few people. Build something together.</text><rect x="797" y="676" width="148" height="43" rx="9" fill="#DDE8CB" /><text x="817" y="702" font-size="12" fill="#4E6834" font-weight="600" >Invite your team</text><rect x="283" y="770" width="692" height="77" rx="12" fill="#FBFCF9" /><circle cx="318" cy="808" r="17" fill="#EFF2E9"/><text x="318" y="814" font-size="15" fill="#A0AA93" font-weight="600" text-anchor="middle">3</text><text x="350" y="802" font-size="17" fill="#8B957D" font-weight="500" >Start something small</text><text x="350" y="825" font-size="12" fill="#AAB19F" font-weight="400" >Your first project can be anything.</text><path d="M283 881h691" stroke="#EAECE7"/><text x="283" y="917" font-size="12" fill="#88957A" font-weight="400" >1 of 3 steps complete</text><rect x="794" y="906" width="181" height="6" rx="3" fill="#EDF1E7" /><rect x="794" y="906" width="61" height="6" rx="3" fill="#9CB77C" /><text x="58" y="1022" font-size="13" fill="#929787" font-weight="500" letter-spacing="1.5">ONBOARDING / DESKTOP</text><text x="1024" y="1022" font-size="15" fill="#677C4A" font-weight="500" text-anchor="end">Ready for your eyes →</text></g></svg>