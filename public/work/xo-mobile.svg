<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">XO Builders mobile onboarding flow</title><desc id="desc">Two mobile screens present an uncluttered workspace setup checklist and team invitation preview.</desc><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#232735" flood-opacity=".10"/></filter><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDC3FA"/><stop offset="1" stop-color="#EFEBFD"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2E8D3"/><stop offset="1" stop-color="#F4F3ED"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#sage)"/><g font-family="Inter, Arial, Helvetica, sans-serif"><rect x="56" y="49" width="43" height="43" rx="13" fill="#333F2B" /><text x="77.5" y="77" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">XO</text><text x="112" y="77" font-size="17" fill="#3C4434" font-weight="700" letter-spacing="2">XO BUILDERS</text><text x="1024" y="77" font-size="14" fill="#74796D" font-weight="500" text-anchor="end" letter-spacing="1.3">DESIGN REVIEW / 02</text><text x="56" y="169" font-size="57" fill="#303A29" font-weight="600" letter-spacing="-2.8">Made for the small screen.</text><text x="58" y="213" font-size="23" fill="#7B8073" font-weight="400" >The same thoughtful flow. A little closer to hand.</text><rect x="115" y="293" width="360" height="682" rx="44" fill="#FDFEFA" filter="url(#shadow)" stroke="#DFE4D7" stroke-width="2"/><text x="144" y="326" font-size="12" fill="#3C4932" font-weight="600" >9:41</text><rect x="248" y="306" width="94" height="24" rx="14" fill="#30382B" /><rect x="420" y="315" width="23" height="10" rx="3" fill="#526148" /><rect x="422" y="317" width="16" height="6" rx="1" fill="#CBD9BC" /><rect x="140" y="364" width="32" height="32" rx="10" fill=