e">NA</text><text x="691" y="720" font-size="14" fill="#4A5D3D" font-weight="600" >Noah Anderson</text><text x="691" y="741" font-size="11" fill="#97A38B" font-weight="400" >Frontend engineer</text><circle cx="913" cy="722" r="10" fill="#DCE9CE"/><path d="m906 722 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="631" y="779" width="308" height="49" rx="12" fill="#3C502F" /><text x="785" y="809" font-size="13" fill="#F6F8EF" font-weight="600" text-anchor="middle">Send 3 invitations</text><text x="785" y="858" font-size="12" fill="#92A083" font-weight="500" text-anchor="middle">I’ll do this later</text><rect x="738" y="954" width="94" height="4" rx="2" fill="#36462B" /><path d="M515 630h16m-6-6 6 6-6 6" fill="none" stroke="#9CAA8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="1020" font-size="12" fill="#919B84" font-weight="500" letter-spacing="1.4">01 / YOUR WORKSPACE</text><text x="605" y="1020" font-size="12" fill="#919B84" font-weight="500" letter-spacing="1.4">02 / YOUR PEOPLE</text></g></svg>