<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">XO Builders release readiness review</title><desc id="desc">A release candidate checklist has five passing checks with final product approval waiting on Alex.</desc><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#232735" flood-opacity=".10"/></filter><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDC3FA"/><stop offset="1" stop-color="#EFEBFD"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2E8D3"/><stop offset="1" stop-color="#F4F3ED"/></linearGradient></defs><rect width="1080" height="1080" fill="#EAF0DF"/><g font-family="Inter, Arial, Helvetica, sans-serif"><rect x="56" y="49" width="43" height="43" rx="13" fill="#333F2B" /><text x="77.5" y="77" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">XO</text><text x="112" y="77" font-size="17" fill="#3C4434" font-weight="700" letter-spacing="2">XO BUILDERS</text><text x="1024" y="77" font-size="14" fill="#74796D" font-weight="500" text-anchor="end" letter-spacing="1.3">RELEASE REVIEW / V0.8</text><text x="56" y="168" font-size="59" fill="#2D3825" font-weight="600" letter-spacing="-2.8">Almost out in the world.</text><text x="58" y="214" font-size="23" fill="#7E8771" font-weight="400" >The work is ready. One last thoughtful look.</text><rect x="56" y="280" width="968" height="697" rx="22" fill="#FFF" filter="url(#shadow)"/><rect x="56" y="280" width="968" height="48" rx="20" fill="#FAFBF8" /><rect x="56" y="304" width="968" height="24" rx="0" fill="#FAFBF8" /><circle cx="80" cy="304" r="5" fill="#D9DED3"/><circle cx="98" cy="304" r="5" fill="#D9DED3"/><circle cx="116" cy="304" r="5" fill="#D9DED3"/><text x="540" y="309" font-size="12" fill="#999E93" font-weight="400" text-anchor="middle">workspace / xo_builders</text><path d="M56 328h968" stroke="#E9ECE4"/><text x="92" y="384" font-size="27" fill="#36482B" font-weight="600" >Release candidate</text><rect x="824" y="357" width="163" height="32" rx="16" fill="#ECF2E3" /><text x="905.5" y="378" font-size="13" fill="#768A58" font-weight="600" text-anchor="middle">v0.8.0-rc.1</text><text x="92" y="418" font-size="15" fill="#929F83" font-weight="400" >Everything checked. Everyone in the loop.</text><rect x="91" y="456" width="897" height="90" rx="13" fill="#F1F6E9" /><circle cx="135" cy="501" r="22" fill="#DFEBCF"/><path d="m127 501 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="175" y="494" font-size="21" fill="#566E3C" font-weight="600" >Ready for product review</text><text x="175" y="521" font-size="13" fill="#8A9B74" font-weight="400" >5 of 6 checks complete. Alex, the last call is yours.</text><circle cx="111" cy="583" r="11" fill="#E4ECD9"/><path d="m104 583 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="588" font-size="15" fill="#61794C" font-weight="600" >Production build</text><text x="435" y="588" font-size="13" fill="#A1AC96" font-weight="400" >Compiled and ready</text><text x="969" y="588" font-size="10" fill="#97AC7F" font-weight="600" text-anchor="end" letter-spacing="1">PASSED</text><path d="M92 607h895" stroke="#EAECE7"/><circle cx="111" cy="636" r="11" fill="#E4ECD9"/><path d="m104 636 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="641" font-size="15" fill="#61794C" font-weight="600" >Accessibility</text><text x="435" y="641" font-size="13" fill="#A1AC96" font-weight="400" >Keyboard paths and labels checked</text><text x="969" y="641" font-size="10" fill="#97AC7F" font-weight="600" text-anchor="end" letter-spacing="1">PASSED</text><path d="M92 660h895" stroke="#EAECE7"/><circle cx="111" cy="689" r="11" fill="#E4ECD9"/><path d="m104 689 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="694" font-size="15" fill="#61794C" font-weight="600" >Mobile QA</text><text x="435" y="694" font-size="13" fill="#A1AC96" font-weight="400" >Small screens, all clear</text><text x="969" y="694" font-size="10" fill="#97AC7F" font-weight="600" text-anchor="end" letter-spacing="1">PASSED</text><path d="M92 713h895" stroke="#EAECE7"/><circle cx="111" cy="742" r="11" fill="#E4ECD9"/><path d="m104 742 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="747" font-size="15" fill="#61794C" font-weight="600" >Invite flow</text><text x="435" y="747" font-size="13" fill="#A1AC96" font-weight="400" >Team invitations verified</text><text x="969" y="747" font-size="10" fill="#97AC7F" font-weight="600" text-anchor="end" letter-spacing="1">PASSED</text><path d="M92 766h895" stroke="#EAECE7"/><circle cx="111" cy="795" r="11" fill="#E4ECD9"/><path d="m104 795 5 5 10-11" fill="none" stroke="#647746" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="800" font-size="15" fill="#61794C" font-weight="600" >Release notes</text><text x="435" y="800" font-size="13" fill="#A1AC96" font-weight="400" >Written and reviewed</text><text x="969" y="800" font-size="10" fill="#97AC7F" font-weight="600" text-anchor="end" letter-spacing="1">PASSED</text><path d="M92 819h895" stroke="#EAECE7"/><circle cx="111" cy="848" r="11" fill="#ECE6D6"/><text x="111" y="853" font-size="11" fill="#A59873" font-weight="600" text-anchor="middle">6</text><text x="139" y="853" font-size="15" fill="#98835C" font-weight="600" >Product approval</text><text x="435" y="853" font-size="13" fill="#B1A286" font-weight="400" >Waiting for Alex</text><text x="969" y="853" font-size="10" fill="#AC9870" font-weight="600" text-anchor="end" letter-spacing="1">P