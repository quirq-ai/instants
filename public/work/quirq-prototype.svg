<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Quirq research handoff prototype</title><desc id="desc">A three-step AI research flow moves from a person’s brief to agent-collected evidence, then a clearly marked human approval checkpoint.</desc><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#232735" flood-opacity=".10"/></filter><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDC3FA"/><stop offset="1" stop-color="#EFEBFD"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2E8D3"/><stop offset="1" stop-color="#F4F3ED"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#violet)"/><g font-family="Inter, Arial, Helvetica, sans-serif"><rect x="56" y="49" width="43" height="43" rx="13" fill="#8570DE" /><text x="77.5" y="77" font-size="30" fill="#fff" font-weight="700" text-anchor="middle">q</text><text x="112" y="77" font-size="17" fill="#3C4434" font-weight="700" letter-spacing="2">QUIRQ AI</text><text x="1024" y="77" font-size="14" fill="#74796D" font-weight="500" text-anchor="end" letter-spacing="1.3">SHARED PROTOTYPE / 01</text><text x="56" y="167" font-size="63" fill="#3B3151" font-weight="600" letter-spacing="-2.8">AI does the legwork.</text><text x="56" y="235" font-size="63" fill="#786899" font-weight="600" letter-spacing="-2.8">You make the call.</text><rect x="56" y="292" width="968" height="697" rx="22" fill="#FDFBFF" filter="url(#shadow)"/><rect x="56" y="292" width="968" height="48" rx="20" fill="#FAFBF8" /><rect x="56" y="316" width="968" height="24" rx="0" fill="#FAFBF8" /><circle cx="80" cy="316" r="5" fill="#D9DED3"/><circle cx="98" cy="316" r="5" fill="#D9DED3"/><circle cx="116" cy="316" r="5" fill="#D9DED3"/><text x="540" y="321" font-size="12" fill="#999E93" font-weight="400" text-anchor="middle">workspace / quirq_ai</text><path d="M56 340h968" stroke="#E9ECE4"/><text x="90" y="391" font-size="27" fill="#473A5D" font-weight="600" >Research handoff</text><rect x="815" y="365" width="177" height="32" rx="16" fill="#EDE6FA" /><text x="903.5" y="386" font-size="13" fill="#8874A7" font-weight="600" text-anchor="middle">PROTOTYPE</text><text x="91" y="426" font-size="15" fill="#A398B2" font-weight="400" >A little intelligence. A human at the right moment.</text><path d="M270 567H539V637" fill="none" stroke="#D6CAE9" stroke-width="3"/><path d="M809 567H539" fill="none" stroke="#D6CAE9" stroke-width="3"/><rect x="90" y="471" width="366" height="133" rx="13" fill="#F4F0F9" stroke="#E7DFF0"/><circle cx="122" cy="505" r="12" fill="#DCD0EB"/><text x="122" y="510" font-size="11" fill="#88749F" font-weight="600" text-anchor="middle">1</text><text x="144" y="510" font-size="17" fill="#695580" font-weight="600" >Start with a brief</text><text x="112" y="550" font-size="12" fill="#A194AF" font-weight="400" >What should we know before we build?</text><rect x="111" y="566" width="54" height="32" rx="16" fill="#ECE5F6" /><text x="138" y="587" font-size="13" fill="#9A86B5" font-weight="600" text-anchor="middle">YOU</text><rect x="623" y="471" width="365" height="133" rx="13" fill="#F4F0F9" stroke="#E7DFF0"/><circle cx="655" cy="505" r="12" fill="#DCD0EB"/><text x="655" y="510" font-size="11" fill="#88749F" font-weight="600" text-anchor="middle">2</text><text x="677" y="510" font-size="17" fill="#695580" font-weight="600" >Gather the evidence</text><text x="645" y="550" font-size="12" fill="#A194AF" font-weight="400" >Useful sources, with the context attached.</text><rect x="644" y="566" width="72" height="32" rx="16" fill="#ECE5F6" /><text x="680" y="587" font-size="13" fill="#9A86B5" font-weight="600" text-anchor="middle">AGENT</text><rect x="204" y="646" width="672" height="233" rx="17" fill="#FFF" stroke="#B9A6D6" stroke-width="2"/><rect x="228" y="670" width="166" height="32" rx="16" fill="#ECE3FA" /><text x="311" y="691" font-size="13" fill="#9075AF" font-weight="600" text-anchor="middle">HUMAN CHECKPOINT</text><text x="228" y="738" font-size="28" fill="#614D7B" font-weight="600" letter-spacing="-.6">A good moment to pause.</text><text x="228" y="771" font-size="14" fill="#A597B4" font-weight="400" >Review the sources. Check the summary. Add your judgment.</text><rect x="228" y="802" width="255" height="47" rx="10" fill="#AB96C6" /><text x="253" y="832" font-size="14" fill="#FFF" font-weight="600" >Review the findings</text><path d="M446 826h16m-6-6 6 6-6 6" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="517" y="832" font-size="12" fill="#AD9FB9" font-weight="400" >3 sources are ready for your review</text><text x="540" y="930" font-size="13" fill="#A89AB7" font-weight="400" text-anchor="middle">Nothing moves forward without your approval.</text><text x="58" y="1035" font-size="12" fill="#A394B8" font-weight="500" letter-spacing="1.7">DESIGNED FOR PEOPLE IN THE LOOP.</text></g></svg>