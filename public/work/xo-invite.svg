<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">XO Builders team invitation screen</title><desc id="desc">A simple invitation form with three teammates and clearly labeled workspace roles.</desc><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#232735" flood-opacity=".10"/></filter><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDC3FA"/><stop offset="1" stop-color="#EFEBFD"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2E8D3"/><stop offset="1" stop-color="#F4F3ED"/></linearGradient></defs><rect width="1080" height="1080" fill="#F0F0E8"/><g font-family="Inter, Arial, Helvetica, sans-serif"><rect x="56" y="49" width="43" height="43" rx="13" fill="#333F2B" /><text x="77.5" y="77" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">XO</text><text x="112" y="77" font-size="17" fill="#3C4434" font-weight="700" letter-spacing="2">XO BUILDERS</text><text x="1024" y="77" font-size="14" fill="#74796D" font-weight="500" text-anchor="end" letter-spacing="1.3">DESIGN REVIEW / 03</text><text x="56" y="169" font-size="55" fill="#303A29" font-weight="600" letter-spacing="-2.6">Good work is a team sport.</text><text x="58" y="213" font-size="23" fill="#7B8073" font-weight="400" >An invitation that makes the next step feel easy.</text><rect x="131" y="298" width="818" height="653" rx="22" fill="#FFFFFF" filter="url(#shadow)"/><rect x="131" y="298" width="818" height="48" rx="20" fill="#FAFBF8" /><rect x="131" y="322" width="818" height="24" rx="0" fill="#FAFBF8" /><circle cx="155" cy="322" r="5" fill="#D9DED3"/><circle cx="173" cy="322" r="5" fill="#D9DED3"/><circle cx="191" cy="322" r="5" fill="#D9DED3"/><text x="540" y="327" font-size="12" fill="#999E93" font-weight="400" text-anchor="middle">workspace / xo_builders</text><path d="M131 346h818" stroke="#E9ECE4"/><text x="187" y="414" font-size="36" fill="#35462B" font-weight="600" letter-spacing="-1">Bring your people.</text><text x="187" y="450" font-size="17" fill="#8B987E" font-weight="400" >Invite teammates to your new workspace.</text><text x="187" y="509" font-size="11" fill="#8A997B" font-weight="600" letter-spacing="1.7">EMAIL ADDRESS</text><text x="744" y="509" font-size="11" fill="#8A997B" font-weight="600" letter-spacing="1.7">WORKSPACE ROLE</text><rect x="187" y="528" width="504" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="207" y="561" font-size="16" fill="#546A42" font-weight="400" >sofia@xo.builders</text><rect x="712" y="528" width="183" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="731" y="561" font-size="15" fill="#6D7E5C" font-weight="400" >Member</text><text x="864" y="561" font-size="16" fill="#8C9A7D" font-weight="400" >⌄</text><rect x="187" y="602" width="504" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="207" y="635" font-size="16" fill="#546A42" font-weight="400" >james@xo.builders</text><rect x="712" y="602" width="183" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="731" y="635" font-size="15" fill="#6D7E5C" font-weight="400" >Admin</text><text x="864" y="635" font-size="16" fill="#8C9A7D" font-weight="400" >⌄</text><rect x="187" y="676" width="504" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="207" y="709" font-size="16" fill="#546A42" font-weight="400" >noah@xo.builders</text><rect x="712" y="676" width="183" height="54" rx="9" fill="#FCFDF9" stroke="#E3E9DA"/><text x="731" y="709" font-size="15" fill="#6D7E5C" font-weight="400" >Member</text><text x="864" y="709" font-size="16" fill="#8C9A7D" font-weight="400" >⌄</text><text x="189" y="783" font-size="15" fill="#80965D" font-weight="500" >+ Add another teammate</text><path d="M187 819h707" stroke="#EAECE7"/><text x="187" y="873" font-size="12" fill="#9BA78E" font-weight="400" >You can always invite more people later.</text><rect x="665" y="845" width="230" height="53" rx="11" fill="#DCE8CB" /><text x="690" y="877" font-size="15" fill="#566D3E" font-weight="600" >Send 3 invitations</text><path d="M857 872h16m-6-6 6 6-6 6" fill="none" stroke="#566D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="389" y="985" width="302" height="32" rx="16" fill="#E5EAD9" /><text x="540" y="1006" font-size="13" fill="#7C8B65" font-weight="600" text-anchor="middle">LESS FRICTION. MORE TOGETHER.</text></g></svg>