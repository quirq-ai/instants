name: Bug report
description: Report a reproducible problem in Instants.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md and keep sensitive details out of public issues. Demo state resetting on refresh and still-photo Reels are intentional."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Include the commit, branch, or deployed build if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS/device, viewport, input method, theme, and reduced-motion setting. Include Node version for setup/build issues.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recording, or relevant logs
      description: Remove tokens, personal information, and sensitive paths before sharing.
